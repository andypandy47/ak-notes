name: Deploy API

on:
  push:
    branches:
      - master
    paths:
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace api
      - run: npm run test:typecheck --workspace api
      - run: npm test --workspace api

  deploy-preview:
    name: Migrate D1 and deploy preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Get short commit SHA
        id: commit
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Apply migrations and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          preCommands: wrangler d1 migrations apply DB --remote --env preview
          command: versions upload --env preview --tag ${{ steps.commit.outputs.short_sha }}
      - name: print deployment-url
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo $DEPLOYMENT_URL
