name: CI Preview

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace api
      - run: npm run test:typecheck --workspace api
      - run: npm test --workspace api

  deploy-preview:
    name: Migrate D1 and deploy preview
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
    outputs:
      api-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Get short commit SHA
        id: commit
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Apply migrations and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          preCommands: wrangler d1 migrations apply DB --remote --env preview
          command: versions upload --env preview --tag ${{ steps.commit.outputs.short_sha }}
      - name: Validate preview URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ "${DEPLOYMENT_URL}" != https://* ]]; then
            echo "Wrangler did not return a valid preview deployment URL." >&2
            exit 1
          fi
          echo "${DEPLOYMENT_URL}"

  build-windows:
    name: Build Windows test app
    needs: deploy-preview
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_API_URL: ${{ needs.deploy-preview.outputs.api-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Build Windows debug bundles
        working-directory: app
        run: npm run tauri -- build --debug
      - name: Upload Windows bundles
        uses: actions/upload-artifact@v6
        with:
          name: aknotes-windows-${{ github.sha }}
          path: app/src-tauri/target/debug/bundle/**
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android test app
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_API_URL: ${{ needs.deploy-preview.outputs.api-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Configure Android NDK
        shell: bash
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
      - name: Initialize Android project
        working-directory: app
        run: npm run tauri -- android init --ci
      - name: Build Android debug APK
        working-directory: app
        run: npm run tauri -- android build --debug --apk --ci
      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: aknotes-android-${{ github.sha }}
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
